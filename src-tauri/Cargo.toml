[package]
name = "lumina"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"
walkdir = "2.5"
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.30"
wallpaper = "3"
image = "0.25"
sha2 = "0.10"
tauri-plugin-dialog = "2"
rand = "0.8"
windows = { version = "0.58", features = ["Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-webview2 = { package = "windows", version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
